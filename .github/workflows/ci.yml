name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: album-studio
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: album-studio/.nvmrc
          cache: npm
          cache-dependency-path: album-studio/package-lock.json
      - run: npm ci
      - run: npm run check
