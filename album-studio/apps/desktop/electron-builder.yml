appId: com.albumstudio.desktop
productName: 咔宝
directories:
  buildResources: build
asar: true
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: true
files:
  - out/**
  - resources/icon.png
  - package.json
  - node_modules/sharp/**
  - node_modules/@img/**
  - node_modules/@emnapi/**
  - node_modules/onnxruntime-node/**
  - node_modules/onnxruntime-common/**
  - node_modules/detect-libc/**
  - node_modules/semver/**
  - node_modules/tslib/**
asarUnpack:
  - '**/node_modules/sharp/**/*'
  - '**/node_modules/@img/**/*'
  - '**/node_modules/onnxruntime-node/**/*'
  - '**/node_modules/onnxruntime-common/**/*'
# AI 模型走 extraResources（不受 .gitignore 排除影响），打包后位于 resources/models
extraResources:
  - from: resources/models
    to: models
    filter:
      - '**/*.onnx'
win:
  icon: build/icon.ico
  executableName: kabo
  target:
    - nsis
    - portable
nsis:
  artifactName: kabo-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  icon: build/icon.icns
  identity: '-'
  hardenedRuntime: false
  entitlementsInherit: build/entitlements.mac.plist
  category: public.app-category.photography
  x64ArchFiles: Contents/Resources/app.asar.unpacked/node_modules/{@img/**/*,onnxruntime-node/bin/napi-v6/darwin/**/*}
  target:
    - target: dmg
      arch:
        - universal
  notarize: false
dmg:
  artifactName: kabo-${version}.${ext}
npmRebuild: false
